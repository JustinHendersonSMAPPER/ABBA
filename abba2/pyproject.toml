[tool.poetry]
name = "abba2"
version = "2.0.0"
description = "ABBA (Annotated Bible and Background Analysis) 2.0 - Free biblical language analysis with academic rigor"
authors = ["ABBA Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "abba2"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core dependencies
click = "^8.1.7"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"

# Data processing
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
requests = "^2.31.0"
aiohttp = "^3.9.0"
pyyaml = "^6.0"

# NLP and ML
sentence-transformers = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
spacy = "^3.7.0"

# API
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
python-multipart = "^0.0.6"

# Utilities
python-dotenv = "^1.0.0"
rich = "^13.7.0"
tqdm = "^4.66.0"
pendulum = "^3.0.0"

# Validation
jsonschema = "^4.20.0"
deepdiff = "^6.7.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
httpx = "^0.25.0"

# Code quality
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
pylint = "^3.0.0"
bandit = "^1.7.0"

# Development tools
ipython = "^8.18.0"
ipdb = "^0.13.0"
pre-commit = "^3.6.0"

[tool.poetry.scripts]
abba2 = "abba2.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = """
    -ra
    -q
    --strict-markers
    --ignore=data
    --ignore=docs
    --cov=abba2
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=95
"""
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["abba2"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring  
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0212",  # Protected access
]