[tool.poetry]
name = "abba"
version = "0.1.0"
description = "Bible Data Extractor - Downloads and extracts Bible translations from bible.db"
authors = ["Justin Henderson <justin@tellaro.io>"]
readme = "README.md"
packages = [{include = "abba"}]

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31.0"
tqdm = "^4.65.0"
python-dotenv = "^1.0.0"
chromadb = "^0.4.0"
sentence-transformers = "^2.2.0"
numpy = "^1.24.0"
torch = "^2.0.0"
loguru = "^0.7.0"
pyyaml = "^6.0.2"

[tool.poetry.scripts]
abba = "main:main"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0"
flake8-bugbear = ">=24.2.6"
pytest = ">=8.1.1"
mypy = ">=1.11.2"
coverage = ">=7.4.4"
pre-commit = ">=3.7.0"
nox = ">=2024.3.2"
genbadge = {extras = ["all"], version = "^1.1.1"}
types-requests = ">=2.31.0.20240403"
isort = ">=5.13.2"
flynt = ">=1.0.1"
bandit = ">=1.7.9"
pytest-env = ">=1.1.3"
ipykernel = ">=6.29.5"
types-croniter = ">=4.0.0.20241030"
types-boto3 = ">=1.0.2"
flake8-isort = ">=6.1.1"
black = {extras = ["jupyter"], version = ">=24.10.0"}
pylint = ">=3.3.3"
vulture = ">=2.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = ["*/site-packages/*", "*/test_data.py"]

[tool.ruff.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
