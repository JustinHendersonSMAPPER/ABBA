[project]
name = "abba"
version = "0.1.0"
description = "Bible Data Extractor - Downloads and extracts Bible translations from bible.db"
authors = [{name = "Justin Henderson", email = "justin@tellaro.io"}]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "chromadb>=0.4.0,<0.5.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
    "loguru>=0.7.0,<0.8.0",
    "pyyaml>=6.0.2,<7.0.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.29.0,<0.40.0",
    "defusedxml>=0.7.1,<0.8.0",
]

[project.scripts]
abba = "abba.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.1.1",
    "pytest-env>=1.1.3",
    "coverage>=7.4.4",
    "pre-commit>=3.7.0",
    "nox>=2024.3.2",
    "genbadge[all]>=1.1.1",
    "types-requests>=2.31.0.20240403",
    "types-croniter>=4.0.0.20241030",
    "types-boto3>=1.0.2",
    "ipykernel>=6.29.5",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abba"]

[tool.coverage.run]
omit = ["*/site-packages/*", "*/test_data.py"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["claude", "abba2", "reports", ".nox", ".badges"]

[tool.ruff.lint]
# Mirrors the previous toolchain: E/F/W = flake8 (pycodestyle/pyflakes),
# B = flake8-bugbear, I = isort, C90 = mccabe, PL = pylint, S = flake8-bandit.
# (pyupgrade/flynt were never enforced by the old nox sessions, so they stay off.)
select = ["E", "F", "W", "B", "I", "C90", "PL", "S"]
ignore = [
    "E203",     # whitespace before ':' (carried from .flake8)
    "E501",     # line too long (the formatter owns line length)
    "S101",     # assert (was bandit B101 skip, applied globally)
    "S608",     # SQL built via f-strings — all queries interpolate only "?" placeholder
                # strings or hardcoded table identifiers; values are passed as parameters.
    "PLR2004",  # magic-value-comparison (not enforced by the old pylint)
    # ported from .pylintrc disables (the "too-many-*" family etc.):
    "PLR0904",  # too-many-public-methods
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0914",  # too-many-locals
    "PLR0915",  # too-many-statements
    "PLR0916",  # too-many-boolean-expressions
    "PLR0917",  # too-many-positional-arguments
    "PLR1702",  # too-many-nested-blocks
    "PLC0415",  # import-outside-top-level
    "PLR6301",  # no-self-use
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "F811", "F401"]   # S101 = assert (was bandit B101 skip)
"abba/api/routes.py" = ["B008"]        # carried from .flake8 per-file-ignores

[tool.ruff.lint.isort]
known-first-party = ["abba"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[tool.pyright]
include = ["abba"]
exclude = ["tests", "claude", "abba2", "reports", "**/.venv", "**/node_modules"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingModuleSource = false
