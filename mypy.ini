[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
exclude = (^tests/.*\.py|^claude/|^abba2/)

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-mmh3.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-loguru.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-nox.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
