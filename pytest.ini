# pytest.ini
[pytest]
testpaths = tests
addopts = --ignore-glob="*test_data.py"

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # Ignore deprecated utcfromtimestamp from opensearch_dsl - this is a third-party library issue
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated and scheduled for removal:DeprecationWarning:opensearch_dsl\.field
    # Ignore crypt deprecation warning from passlib
    ignore:'crypt' is deprecated and slated for removal in Python:DeprecationWarning:passlib\.utils
    # Ignore Pydantic V2 migration warnings
    ignore:Support for class-based `config` is deprecated.*:DeprecationWarning:pydantic\._internal\._config
    # Ignore argon2 version access deprecation
    ignore:Accessing argon2\.__version__ is deprecated.*:DeprecationWarning:passlib\.handlers\.argon2
    # Keep general ignores for other warnings
    ignore::DeprecationWarning:starlette
    ignore::pytest.PytestDeprecationWarning:pytest_asyncio.plugin

markers =
    anyio: mark test as anyio to run with an async backend
    integration: mark test as integration test requiring external services
